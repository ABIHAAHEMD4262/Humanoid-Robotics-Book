[pytest]
# Pytest configuration for RAG Chatbot Backend

# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test* *Test
python_functions = test_*

# Test directories
testpaths = tests

# Markers for test categorization
markers =
    unit: Unit tests - fast, isolated, no external dependencies
    integration: Integration tests - test component interactions
    contract: Contract tests - validate API request/response schemas
    slow: Tests that take significant time to run
    requires_db: Tests that require database connection
    requires_qdrant: Tests that require Qdrant vector DB
    requires_redis: Tests that require Redis connection

# Coverage configuration
addopts =
    --verbose
    --strict-markers
    --tb=short
    --cov=src
    --cov-report=term-missing
    --cov-report=html
    --cov-fail-under=80
    -ra

# Ignore warnings from third-party packages
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Minimum Python version
minversion = 3.11

# Test execution settings
console_output_style = progress
log_cli = false
log_cli_level = INFO

# Disable cacheprovider for clean test runs
cache_dir = .pytest_cache
